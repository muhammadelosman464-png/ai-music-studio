services:
  - type: web
    name: ai-music-studio-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: SUNO_API_KEY
        sync: false
      - key: SUNO_API_ENDPOINT
        value: https://api.sunoapi.org/api/v1/generate
      - key: SECONDARY_AI_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
